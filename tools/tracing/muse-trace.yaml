--- !<tag:barectf.org,2020/3/config>
trace:
  type:
    native-byte-order: little-endian
    uuid: 8a1fcd82-3b4e-4e1a-9c0a-000000000001
    clock-types:
      mono_ms:
        frequency: 1000
        precision: 1
        offset:
          seconds: 0
          cycles: 0
        origin-is-unix-epoch: false
        description: FreeRTOS tick counter in milliseconds
    data-stream-types:
      main:
        $default-clock-type-name: mono_ms
        event-record-types:

          ble_init_called:
            payload-field-type:
              class: structure
              members:
                - free_heap:
                    field-type: {class: unsigned-integer, size: 32}

          ble_task_spawn:
            payload-field-type:
              class: structure
              members:
                - success:
                    field-type: {class: unsigned-integer, size: 8}

          ble_task_start:
            payload-field-type:
              class: structure
              members:
                - core_id:
                    field-type: {class: unsigned-integer, size: 8}

          ble_nimble_init_done: {}

          ble_service_created: {}

          ble_adv_start: {}

          ble_connected:
            payload-field-type:
              class: structure
              members:
                - conn_handle:
                    field-type: {class: unsigned-integer, size: 16}

          ble_disconnected:
            payload-field-type:
              class: structure
              members:
                - conn_handle:
                    field-type: {class: unsigned-integer, size: 16}
                - reason:
                    field-type: {class: unsigned-integer, size: 8}

          ble_notify_page:
            payload-field-type:
              class: structure
              members:
                - text_len:
                    field-type: {class: unsigned-integer, size: 32}
                - chunks:
                    field-type: {class: unsigned-integer, size: 8}
                - initialized:
                    field-type: {class: unsigned-integer, size: 8}
                - connected:
                    field-type: {class: unsigned-integer, size: 8}

          reader_save_progress:
            payload-field-type:
              class: structure
              members:
                - spine:
                    field-type: {class: unsigned-integer, size: 16}
                - page:
                    field-type: {class: unsigned-integer, size: 16}
                - offset:
                    field-type: {class: unsigned-integer, size: 32}

          reader_text_extracted:
            payload-field-type:
              class: structure
              members:
                - length:
                    field-type: {class: unsigned-integer, size: 32}

          reader_render_done:
            payload-field-type:
              class: structure
              members:
                - duration_ms:
                    field-type: {class: unsigned-integer, size: 32}

          sys_heap_mark:
            payload-field-type:
              class: structure
              members:
                - free_bytes:
                    field-type: {class: unsigned-integer, size: 32}
                - min_free_bytes:
                    field-type: {class: unsigned-integer, size: 32}

          sys_task_create:
            payload-field-type:
              class: structure
              members:
                - stack_bytes:
                    field-type: {class: unsigned-integer, size: 32}
                - result:
                    field-type: {class: unsigned-integer, size: 8}
