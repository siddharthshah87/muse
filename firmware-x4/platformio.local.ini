; Margin/Muse local PlatformIO overrides for the X4 Pro (ESP32-S3).
;
; TRACKED SOURCE OF TRUTH. tools/setup-crosspoint.sh copies this file AND
; partitions_x4pro.csv into the (git-ignored) upstream working tree at
; firmware-x4/crosspoint/. Both must be present for the build to work.
;
; This is the intended local-override hook (see [platformio] extra_configs in
; CrossPoint's platformio.ini) — ZERO edits to upstream, minimizing fork
; divergence (see ../docs/forking.md). The X4 Pro board profile
; (BoardConfig::XTEINK_X4_PRO) lives in the freeink-sdk submodule.
;
;   Build:  ./tools/build-firmware.sh
;   Flash:  ./tools/build-firmware.sh -t upload --upload-port <PORT>   (app0 @ 0x10000)

[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8   ; 16 MB flash + 8 MB PSRAM, matches the X4 Pro
board_build.mcu = esp32s3
; X4 Pro partition layout differs from CrossPoint's default C3 partitions.csv:
; app partitions are 7.875 MB (vs 6.25 MB) and app1 sits at 0x7F0000 (vs
; 0x650000). Using the wrong table causes bootloops — the bootloader finds the
; OEM app1 at the wrong offset. See firmware-x4/partitions_x4pro.csv.
board_build.partitions = partitions_x4pro.csv
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1   ; required for the X4 Pro SDMMC path
  ; git_branch.py only injects CROSSPOINT_VERSION for default/sticky, so set it
  ; here (like the release envs) to keep zero upstream edits.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-muse\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2                     ; debug logs for bring-up
