; Margin/Muse local PlatformIO overrides for the X4 Pro (ESP32-S3).
;
; TRACKED SOURCE OF TRUTH. tools/setup-crosspoint.sh copies this file AND
; partitions_x4pro.csv into the (git-ignored) upstream working tree at
; firmware-x4/crosspoint/. Both must be present for the build to work.
;
; The upstream feat-x4-papermono-support branch (PR #2983) already defines
; [env:x4pro] with all required flags. This overlay adds only the X4 Pro
; partition table (missing from upstream) and a Muse build marker.
;
; PlatformIO merges extra_configs sections — keys here win over upstream.
;
;   Build:  ./tools/build-firmware.sh
;   Flash:  python tools/flash_x4pro.py

[env:x4pro]
board_build.partitions = partitions_x4pro.csv
build_flags =
  -DMUSE_BUILD=1
