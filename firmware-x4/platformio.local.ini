; Margin/Muse local PlatformIO overrides for the X4 Pro (ESP32-S3).
;
; TRACKED SOURCE OF TRUTH. tools/setup-crosspoint.sh copies this file AND
; partitions_x4pro.csv into the (git-ignored) upstream working tree.
;
; NOTE: PlatformIO extra_configs REPLACES (not merges) duplicate sections, so
; we must repeat all upstream [env:x4pro] keys here and add our extras.
; Source: feat-x4-papermono-support branch (PR #2983).
;
;   Build:  ./tools/build-firmware.sh
;   Flash:  python tools/flash_x4pro.py

[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; X4 Pro partitions differ from default C3 layout — app1 at 0x7F0000 not 0x650000.
board_build.partitions = partitions_x4pro.csv
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-muse\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DMUSE_BUILD=1
